<!doctype html>
<html><head><meta charset="utf-8"><title>Timbul banner</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Doto:ROND,wght@100,700..900&display=swap" rel="stylesheet">
<style>
/* Rendered to ../banner.jpg at 2000x800. The app's own look: tactile-paving yellow, black, everything in dots. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 2000px; height: 800px; overflow: hidden; background: #ffcc00; }
body { font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; color: #000; position: relative; }
.rail { position: absolute; top: 40px; bottom: 40px; width: 10px;
  background: radial-gradient(circle, #000 3.2px, transparent 3.8px) 0 0 / 10px 20px repeat-y; }
.rail.l { left: 40px; } .rail.r { right: 40px; }
.left { position: absolute; left: 120px; top: 92px; width: 820px; }
.mark { font-family: "Doto", monospace; font-weight: 900; font-variation-settings: "ROND" 100; font-size: 150px; line-height: 0.85; letter-spacing: -4px; }
.head { font-weight: 800; font-size: 76px; line-height: 1.0; letter-spacing: -1px; margin-top: 40px; }
.sub { font-weight: 600; font-size: 30px; line-height: 1.3; margin-top: 26px; max-width: 830px; }
.chips { display: flex; gap: 16px; margin-top: 44px; }
.chip { font-weight: 800; font-size: 25px; padding: 13px 22px; border: 3px solid #000; border-radius: 999px; }
.chip.dark { background: #000; color: #ffcc00; }
.right { position: absolute; right: 120px; top: 70px; width: 900px; height: 660px; }
.card { position: absolute; background: #fff; border: 4px solid #000; box-shadow: 14px 14px 0 #000; }
.card img { display: block; width: 100%; }
.fig { left: 0; top: 0; width: 470px; padding: 14px; transform: rotate(-3deg); }
.sheet { right: 0; bottom: 0; width: 600px; padding: 8px; transform: rotate(1.5deg); }
.tag { position: absolute; font-weight: 800; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; background: #000; color: #ffcc00; padding: 8px 14px; }
.tag.a { left: 12px; top: 352px; transform: rotate(-3deg); }
.tag.b { right: 14px; bottom: -22px; }
</style></head>
<body>
  <div class="rail l"></div><div class="rail r"></div>
  <div class="left">
    <div class="mark">Timbul</div>
    <div class="head">Every figure,<br>for every student.</div>
    <div class="sub">One photo of a textbook page becomes a raised-dot sheet a blind student can feel, and ask about by voice.</div>
    <div class="chips"><span class="chip dark">Gemini on Google Cloud</span><span class="chip">AI Builder Cup 2026</span></div>
  </div>
  <div class="right">
    <div class="card fig"><img src="figure.png" alt=""></div>
    <div class="tag a">The textbook figure</div>
    <div class="card sheet"><img src="sheet.png" alt=""></div>
    <div class="tag b">Timbul's tactile sheet</div>
  </div>
</body></html>
